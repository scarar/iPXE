# 1. Wipe existing RAID and LVM volumes to prevent installer hangs
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# 2. Select the two physical drives 
# Note: If your Vultr instance uses NVMe, change this to /dev/nvme0n1 /dev/nvme1n1
d-i partman-auto/disk string /dev/sda /dev/sdb
d-i partman-auto/method string raid

# 3. Define the physical disk layout recipe
# This applies to all selected disks. It creates a 512MB EFI partition (Partition 1) 
# and assigns the rest of the disk to a RAID volume (Partition 2).
d-i partman-auto/expert_recipe string \
    multiraid :: \
        512 512 512 free \
            $iflabel{ gpt } \
            $reusemethod{ } \
            method{ efi } format{ } . \
        100 10000 -1 raid \
            $lvmignore{ } \
            method{ raid } .

# 4. Define the RAID 0 array structure
# Format: <raid_level> <dev_count> <spare_count> <fstype> <mount_point> <devices> <spare_devices>
d-i partman-auto-raid/recipe string \
    0 2 0 ext4 / \
    /dev/sda2#/dev/sdb2 .

# 5. Automatically confirm and write the changes without prompting
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# 6. Force GRUB installation to the primary drive's EFI partition
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

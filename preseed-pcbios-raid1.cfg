# Debian 13 (trixie) unattended install - Vultr bare metal, legacy BIOS boot
# Two NVMe drives: /boot on RAID 1 (small, bootable from either drive), / on RAID 1 (mirrored: one drive can fail; needs drives large enough for the chains, e.g. 2 x 1.9 TB).
# Loaded by boot.ipxe as preseed-${platform}-${raid}.cfg (raid=raid1); this file is used when iPXE runs on BIOS.

# --- Locale and keyboard ---
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# --- Network (DHCP) ---
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string test-1
d-i netcfg/get_domain string
d-i netcfg/hostname string test-1
d-i hw-detect/load_firmware boolean true

# --- Mirror ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true

# --- Accounts: root only; SSH by key (added in late_command), console by password ---
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password-crypted password $6$T1LIXSCer5lsOmdQ$H3rtSJWEB.cWq4GdrBUlqowrdNAuf2Fy/Ac.uxPYcVtTzKtmo54nf7JHHQZ9nGfTEJo2teh/gLhl8GhrennDy.

# --- Clock ---
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# --- Partitioning: wipe old RAID/LVM, GPT on both NVMe drives ---
d-i partman-auto/disk string /dev/nvme0n1 /dev/nvme1n1
d-i partman-auto/method string raid
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt

# Each drive: p1 = 1 MB BIOS boot partition (GRUB core on GPT), p2 = 1 GB RAID member (/boot), p3 = rest RAID member (/)
d-i partman-auto/expert_recipe string \
    raid1root :: \
        1 1 1 free \
            $iflabel{ gpt } \
            $reusemethod{ } \
            method{ biosgrub } . \
        1024 1024 1024 raid \
            $lvmignore{ } \
            method{ raid } . \
        10000 10000 -1 raid \
            $lvmignore{ } \
            method{ raid } .

# <level> <devices> <spares> <fs> <mount> <members>
d-i partman-auto-raid/recipe string \
    1 2 0 ext4 /boot /dev/nvme0n1p2#/dev/nvme1n1p2 . \
    1 2 0 ext4 / /dev/nvme0n1p3#/dev/nvme1n1p3 .

# No swap partition: late_command creates an 8 GB /swapfile instead (resizable, lives on the RAID 1 root)
d-i partman-basicfilesystems/no_swap boolean false

d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- Packages ---
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server mdadm curl ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# --- Boot loader (BIOS): GRUB on both drives so either can boot ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/nvme0n1 /dev/nvme1n1

# --- Root SSH key (root may log in with this key only; sshd default is prohibit-password) ---
# --- Swap: 8 GB file, swappiness 10 so it is only used under memory pressure (out-of-memory safety net) ---
d-i preseed/late_command string \
    mkdir -p /target/root/.ssh; \
    echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGk4K/8DRsMI4BeoSgr55eLzs5F5noQ6E4NTNh5u6fo0 vultr-test-1' > /target/root/.ssh/authorized_keys; \
    chmod 700 /target/root/.ssh; \
    chmod 600 /target/root/.ssh/authorized_keys; \
    in-target fallocate -l 8G /swapfile; \
    in-target chmod 600 /swapfile; \
    in-target mkswap /swapfile; \
    echo '/swapfile none swap sw,nofail 0 0' >> /target/etc/fstab; \
    echo 'vm.swappiness = 10' > /target/etc/sysctl.d/92-swap.conf

# --- Finish ---
d-i finish-install/reboot_in_progress note
